<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>T-Ball Tournament Scorer</title>
    <style>
        body { font-family: sans-serif; background: #f0f2f5; padding: 10px; }
        .tabs { display: flex; overflow-x: auto; gap: 5px; margin-bottom: 15px; }
        .tab { padding: 10px 15px; background: #ddd; border-radius: 5px; cursor: pointer; white-space: nowrap; }
        .tab.active { background: #007bff; color: white; }
        .section { display: none; background: white; padding: 15px; border-radius: 8px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
        .section.active { display: block; }
        table { width: 100%; border-collapse: collapse; margin-top: 15px; font-size: 14px; }
        th, td { border: 1px solid #ccc; padding: 8px; text-align: center; }
        th { background: #eee; }
        .fixture-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid #eee; }
        .fixture-row input { width: 40px; text-align: center; padding: 5px; }
        .team-name { width: 35%; font-weight: bold; }
        .vs { width: 10%; color: #888; }
        h2 { color: #333; border-bottom: 2px solid #007bff; padding-bottom: 5px; }
    </style>
</head>
<body>

    <h1>🏆 T-Ball Scorer</h1>
    
    <div class="tabs">
        <div class="tab active" onclick="showDiv('u9a')">U9 Division A</div>
        <div class="tab" onclick="showDiv('u9bc')">U9 Div B & C</div>
        <div class="tab" onclick="showDiv('u11a')">U11 Division A</div>
        <div class="tab" onclick="showDiv('u11bcd')">U11 Div B, C, D</div>
    </div>

    <div id="u9a" class="section active">
        <h2>U9 Division A (Pitch 1)</h2>
        <div id="fixtures-u9a"></div>
        <h3>Standings</h3>
        <table id="table-u9a"></table>
    </div>

    <div id="u9bc" class="section">
        <h2>U9 Division B & C (Pitch 2)</h2>
        <div id="fixtures-u9bc"></div>
        <h3>Standings</h3>
        <table id="table-u9bc"></table>
    </div>

    <div id="u11a" class="section">
        <h2>U11 Division A (Pitch 5)</h2>
        <div id="fixtures-u11a"></div>
        <h3>Standings</h3>
        <table id="table-u11a"></table>
    </div>

    <div id="u11bcd" class="section">
        <h2>U11 Division B, C, D (Pitch 3 & 4)</h2>
        <div id="fixtures-u11bcd"></div>
        <h3>Standings</h3>
        <table id="table-u11bcd"></table>
    </div>

<script>
    const data = {
        u9a: {
            teams: ["U9 Green Valley (A)", "U9 S107 (A)", "U9 Dusit (A)", "U9 Sathorn (A)"],
            fixtures: [
                {time: "8:45", t1: "U9 Green Valley (A)", t2: "U9 S107 (A)"},
                {time: "9:25", t1: "U9 S107 (A)", t2: "U9 Dusit (A)"},
                {time: "10:05", t1: "U9 Green Valley (A)", t2: "U9 Sathorn (A)"},
                {time: "10:45", t1: "U9 Sathorn (A)", t2: "U9 S107 (A)"},
                {time: "11:25", t1: "U9 Green Valley (A)", t2: "U9 Dusit (A)"},
                {time: "12:05", t1: "U9 Dusit (A)", t2: "U9 Sathorn (A)"}
            ]
        },
        u9bc: {
            teams: ["U9 Green Valley (B)", "U9 S107 (B)", "U9 S107 (C)", "U9 Sathorn (B)"],
            fixtures: [
                {time: "8:45", t1: "U9 Green Valley (B)", t2: "U9 S107 (B)"},
                {time: "9:25", t1: "U9 S107 (B)", t2: "U9 S107 (C)"},
                {time: "10:05", t1: "U9 Green Valley (B)", t2: "U9 Sathorn (B)"},
                {time: "10:45", t1: "U9 Sathorn (B)", t2: "U9 S107 (B)"},
                {time: "11:25", t1: "U9 Green Valley (B)", t2: "U9 S107 (C)"},
                {time: "12:05", t1: "U9 S107 (C)", t2: "U9 Sathorn (B)"}
            ]
        },
        u11a: {
            teams: ["U11 Green Valley (A)", "U11 S107 (A)", "U11 Dusit (A)", "U11 Sathorn (A)"],
            fixtures: [
                {time: "8:45", t1: "U11 Green Valley (A)", t2: "U11 S107 (A)"},
                {time: "9:25", t1: "U11 S107 (A)", t2: "U11 Dusit (A)"},
                {time: "10:05", t1: "U11 Green Valley (A)", t2: "U11 Sathorn (A)"},
                {time: "10:45", t1: "U11 Sathorn (A)", t2: "U11 S107 (A)"},
                {time: "11:25", t1: "U11 Green Valley (A)", t2: "U11 Dusit (A)"},
                {time: "12:05", t1: "U11 Dusit (A)", t2: "U11 Sathorn (A)"}
            ]
        },
        u11bcd: {
            teams: ["U11 Green Valley (B)", "U11 Green Valley (C)", "U11 S107 (B)", "U11 S107 (C)", "U11 S107 (D)", "U11 Dusit (B)", "U11 Sathorn (B)"],
            fixtures: [
                {time: "8:45", t1: "U11 S107 (B)", t2: "U11 S107 (C)"},
                {time: "8:45", t1: "U11 Green Valley (B)", t2: "U11 Green Valley (C)"},
                {time: "9:05", t1: "U11 Green Valley (C)", t2: "U11 S107 (C)"},
                {time: "9:05", t1: "U11 S107 (B)", t2: "U11 Dusit (B)"},
                {time: "9:25", t1: "U11 Green Valley (C)", t2: "U11 Dusit (B)"},
                {time: "9:25", t1: "U11 Green Valley (B)", t2: "U11 S107 (D)"},
                {time: "9:45", t1: "U11 Dusit (B)", t2: "U11 Sathorn (B)"},
                {time: "10:05", t1: "U11 S107 (B)", t2: "U11 S107 (D)"},
                {time: "10:05", t1: "U11 S107 (C)", t2: "U11 Sathorn (B)"},
                {time: "10:25", t1: "U11 Green Valley (B)", t2: "U11 Sathorn (B)"},
                {time: "10:25", t1: "U11 Green Valley (C)", t2: "U11 S107 (B)"},
                {time: "10:45", t1: "U11 S107 (D)", t2: "U11 Sathorn (B)"},
                {time: "10:45", t1: "U11 S107 (C)", t2: "U11 Dusit (B)"},
                {time: "11:25", t1: "U11 S107 (D)", t2: "U11 Dusit (B)"},
                {time: "11:25", t1: "U11 Green Valley (B)", t2: "U11 S107 (C)"},
                {time: "11:45", t1: "U11 S107 (B)", t2: "U11 Sathorn (B)"},
                {time: "11:45", t1: "U11 Green Valley (B)", t2: "U11 Dusit (B)"},
                {time: "12:05", t1: "U11 S107 (C)", t2: "U11 S107 (D)"},
                {time: "12:05", t1: "U11 Green Valley (C)", t2: "U11 Sathorn (B)"},
                {time: "12:25", t1: "U11 Green Valley (C)", t2: "U11 S107 (D)"},
                {time: "12:25", t1: "U11 Green Valley (B)", t2: "U11 S107 (B)"}
            ]
        }
    };

    function showDiv(id) {
        document.querySelectorAll('.section, .tab').forEach(el => el.classList.remove('active'));
        document.getElementById(id).classList.add('active');
        event.target.classList.add('active');
    }

    function init() {
        for (let divId in data) {
            const container = document.getElementById(`fixtures-${divId}`);
            data[divId].fixtures.forEach((f, idx) => {
                const row = document.createElement('div');
                row.className = 'fixture-row';
                row.innerHTML = `
                    <span style="font-size:11px; width:10%">${f.time}</span>
                    <span class="team-name">${f.t1}</span>
                    <input type="number" id="s1-${divId}-${idx}" oninput="updateTable('${divId}')">
                    <span class="vs">vs</span>
                    <input type="number" id="s2-${divId}-${idx}" oninput="updateTable('${divId}')">
                    <span class="team-name" style="text-align:right">${f.t2}</span>
                `;
                container.appendChild(row);
            });
            updateTable(divId);
        }
    }

    function updateTable(divId) {
        const stats = {};
        data[divId].teams.forEach(t => stats[t] = {pts: 0, rf: 0, ra: 0});

        data[divId].fixtures.forEach((f, idx) => {
            const s1 = parseInt(document.getElementById(`s1-${divId}-${idx}`).value);
            const s2 = parseInt(document.getElementById(`s2-${divId}-${idx}`).value);

            if (!isNaN(s1) && !isNaN(s2)) {
                stats[f.t1].rf += s1; stats[f.t1].ra += s2;
                stats[f.t2].rf += s2; stats[f.t2].ra += s1;
                if (s1 > s2) { stats[f.t1].pts += 4; stats[f.t2].pts += 1; }
                else if (s2 > s1) { stats[f.t2].pts += 4; stats[f.t1].pts += 1; }
                else { stats[f.t1].pts += 2; stats[f.t2].pts += 2; }
            }
        });

        const sorted = Object.keys(stats).sort((a, b) => {
            if (stats[b].pts !== stats[a].pts) return stats[b].pts - stats[a].pts;
            return stats[b].rf - stats[a].rf; // Tie-breaker 2: Runs Scored
        });

        const table = document.getElementById(`table-${divId}`);
        table.innerHTML = `<tr><th>Team</th><th>Pts</th><th>RF</th><th>RA</th></tr>`;
        sorted.forEach(t => {
            const row = table.insertRow();
            row.innerHTML = `<td>${t}</td><td>${stats[t].pts}</td><td>${stats[t].rf}</td><td>${stats[t].ra}</td>`;
        });
    }

    init();
</script>
</body>
</html>
